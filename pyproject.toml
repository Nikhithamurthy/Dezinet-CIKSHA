[project]
name = "dezinet-ciksha"
version = "0.1.0"
description = "Dezinet CIKSHA AI Knowledge Engine & Enterprise Search System"
readme = "README.md"
authors = [
    { name = "N.Nikhitha", email = "nikhithamurthy542@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.4.6",
    "openai>=3.42.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "redis>=8.1.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["tiktoken.*", "docx.*", "bs4.*", "pypdf.*", "langchain_text_splitters.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["openai.*", "sentence_transformers.*", "numpy.*", "redis.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
follow_imports = "skip"
